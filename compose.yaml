services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: tp_user
      POSTGRES_PASSWORD: tp_password
      POSTGRES_DB: tp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data: